name: Deploy to Pages

# The repository holds more than the site — src/, tasks/ and the toolchain are
# kept in git but must not be reachable on the domain. Astro gives that for
# free: dist/ only ever contains the built pages plus a verbatim copy of
# public/, so publishing dist/ is the whole guarantee. Nothing is hand-copied.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pinned to the major version the site is developed against locally.
      # Astro 7 requires >=22.12.0; a drift here is a drift in the output.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
