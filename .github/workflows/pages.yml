name: Deploy to Pages

# The repository holds more than the site — src/, tasks/ and the toolchain are
# kept in git but must not be reachable on the domain. Astro gives that for
# free: dist/ only ever contains the built pages plus a verbatim copy of
# public/, so publishing dist/ is the whole guarantee. Nothing is hand-copied.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Every action below is pinned to a commit SHA rather than to its tag. A tag is
# a movable pointer: the owner of an action can repoint v4 at new code, and a
# workflow that trusts a tag runs whatever it points at that morning, with this
# repository's contents and a Pages deploy token in scope. All five here are
# GitHub's own, so this is hardening rather than distrust. The trailing comment
# on each line is the version the SHA was, and is what to read when upgrading:
# resolve the new tag with `gh api repos/<action>/commits/<tag> --jq .sha` and
# replace both the SHA and the comment together.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned to the major version the site is developed against locally.
      # Astro 7 requires >=22.12.0; a drift here is a drift in the output.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
