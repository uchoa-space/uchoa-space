<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card: landing</title>
<style>
    /* Palette and type taken from the live site: the custom properties in
       src/pages/index.astro's inline <style>, and public/assets/type.css.
       Nothing here is loaded over the network: the cards must render
       identically on any machine, so only system fonts are named. */
    :root {
      --bg-page: #030410;
      --gold: #f5c451;
      --gold-dim: #a9803a;
      --star: #DFE6FF;
      --text-primary: #d8dae2;
      --text-bright: #eef0f6;
      --text-secondary: #b3b8c6;
      --text-footer: #7b8298;
      --ui: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --display: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; background: var(--bg-page); }

    /* The screenshot window is exactly 1200x630, so the card is the viewport.
       overflow:hidden keeps the starfield's slice crop off the page box. */
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--bg-page);
      font-family: var(--ui);
      -webkit-font-smoothing: antialiased;
    }

    /* The site's starfield (public/assets/starfield-desktop.svg), inlined so
       the card renders with no external request. Two departures from the
       source file, both for this medium: coordinates are rounded to one
       decimal, and every radius is multiplied by 1.7. At 1200x630, and again
       at the ~500px a chat client renders a card at, the original sub-pixel
       stars disappear entirely. */
    .stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.85;
    }

    /* The gold cast the wordmark's drop-shadow throws on the live hero,
       carried behind the whole card so the near-black is not flat. */
    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(58% 62% at 50% 38%, rgba(245, 196, 81, 0.09), rgba(3, 4, 16, 0) 70%);
    }

    .content {
      position: relative;
      height: 100%;
      /* 80px on every side: platforms crop a card's edges, and the brief
         allows nothing readable within 60px of one. */
      padding: 80px;
      display: flex;
      flex-direction: column;
    }

    /* --- wordmark ---
       The rule from src/pages/index.astro, kept intact: live text under the
       matrix the original canvas rasterised the word with (condense to 86%,
       slant, stretch 4% taller), hollowed out by text-stroke with the glow
       around that stroke. */
    .wordmark {
      margin: 0;
      font-family: var(--display);
      font-weight: 900;
      letter-spacing: 0.084em;
      line-height: 1.04;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: 3px var(--gold);
      transform: matrix(0.86, 0, -0.16, 1.04, 0, 0);
      filter:
        drop-shadow(0 0 7px rgba(245, 196, 81, 0.55))
        drop-shadow(0 0 20px rgba(245, 196, 81, 0.28));
    }

    /* --- landing card ---
       Intent decision 2: the landing's card is the wordmark, not a portrait.
       The lede sits under it because the intent frames a card as a reading
       surface: a name alone tells the next reader nothing. */
    .content {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 28px;
    }

    /* Two lines, the way the site's own hero stacks the wordmark below its
       640px breakpoint. Forced rather than left to wrapping: a card is a
       fixed canvas, and the break has to be the same every render. */
    .wordmark { font-size: 100px; }
    .wordmark span { display: block; }

    .lede {
      margin: 0;
      max-width: 860px;
      color: var(--text-primary);
      font-size: 38px;
      font-weight: 500;
      line-height: 1.35;
      /* Same as the live hero's .lede: two even lines beat a one-word orphan. */
      text-wrap: balance;
    }

    /* flex: none, or the column's default shrink flattens a 3px item to
       nothing the moment the stack is a hair taller than the content box. */
    .rule {
      flex: none;
      width: 96px;
      height: 3px;
      background: var(--gold);
      opacity: 0.75;
    }

    /* In flow, not absolutely positioned: absolute bottom:0 would resolve
       against .content's padding box, which is the full card, dropping the
       line into the 80px margin platforms crop. */
    .domain {
      margin: 22px 0 0;
      color: var(--text-footer);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
</style>
</head>
